async function inflate64(s){const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('Trình duyệt cần hỗ trợ DecompressionStream');const ds=new DecompressionStream('deflate');return await new Response(new Blob([b]).stream().pipeThrough(ds)).text()}
function addHist(w){let h=JSON.parse(localStorage.hist||'[]').filter(x=>x!==w);h.unshift(w);localStorage.hist=JSON.stringify(h.slice(0,60))}
function saved(){return JSON.parse(localStorage.saved||'[]')} function toggleSave(w){let s=saved();s=s.includes(w)?s.filter(x=>x!==w):[w,...s];localStorage.saved=JSON.stringify(s);renderSaved();document.querySelector('#star')&&(document.querySelector('#star').textContent=s.includes(w)?'★':'☆')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function lookup(term){term=term.trim();if(!term)return;sug.innerHTML='';res.innerHTML='<div class="hint">Đang tra…</div>';try{const a=await entriesFor(term),k=key(term),e=a.find(x=>key(x[0])===k);if(!e){res.innerHTML='<div class="empty">Không tìm thấy từ <b>'+esc(term)+'</b>.</div>';showSuggestions(term);return}let d=await inflate64(e[2]);addHist(e[0]);res.innerHTML='<div class="defhead"><h2>'+esc(e[0])+'</h2><span class="small">'+esc(e[1]||'')+'</span><button id="star" class="star">'+(saved().includes(e[0])?'★':'☆')+'</button></div><div class="definition">'+d+'</div>';document.querySelector('#star').onclick=()=>toggleSave(e[0])}catch(err){res.innerHTML='<div class="card">Lỗi: '+esc(err.message)+'</div>'}}
async function showSuggestions(term){term=term.trim();if(!term){sug.innerHTML='';return}try{const a=await entriesFor(term),k=key(term);let hits=a.filter(x=>key(x[0]).startsWith(k)).sort((x,y)=>{const ax=key(x[0]),ay=key(y[0]);if(ax===k)return -1;if(ay===k)return 1;if(ax.length!==ay.length)return ax.length-ay.length;return ax.localeCompare(ay,mode==='vc'?'vi':'zh')}).slice(0,24);if(!hits.length)hits=a.filter(x=>key(x[0]).includes(k)).sort((x,y)=>key(x[0]).indexOf(k)-key(y[0]).indexOf(k)||x[0].length-y[0].length).slice(0,16);sug.innerHTML=hits.length?'<div class="suggest">'+hits.map(x=>'<div class="srow" data-w="'+esc(x[0])+'"><b>'+esc(x[0])+'</b><span class="sub">'+esc(x[1]||'')+'</span></div>').join('')+'</div>':'';sug.querySelectorAll('.srow').forEach(el=>el.onclick=()=>{q.value=el.dataset.w;lookup(el.dataset.w)})}catch(e){}}
let timer;q.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>showSuggestions(q.value),120)};q.onkeydown=e=>{if(e.key==='Enter')lookup(q.value)};document.querySelector('#go').onclick=()=>lookup(q.value);dir.onclick=()=>{mode=mode==='cv'?'vc':'cv';updateDir();res.innerHTML='<div class="hint">Đã đổi chiều từ điển.</div>';showSuggestions(q.value)};
document.querySelector('#quickStar').onclick=()=>document.querySelector('[data-p=saved]').click();document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.querySelector('#'+t.dataset.p).classList.add('active');if(t.dataset.p==='saved')renderSaved();if(t.dataset.p==='history')renderHistory()});
function renderSaved(){const s=saved();document.querySelector('#savedList').innerHTML=s.length?s.map(w=>'<div class="card sopen" data-w="'+esc(w)+'"><b>'+esc(w)+'</b></div>').join(''):'<div class="empty">Chưa có từ đã lưu.</div>';bindOpen('#savedList')}
function renderHistory(){const h=JSON.parse(localStorage.hist||'[]');document.querySelector('#historyList').innerHTML=(h.length?'<div class="toolbar"><button class="btn" id="clearHist">Xóa lịch sử</button></div>'+h.map(w=>'<div class="card sopen" data-w="'+esc(w)+'"><b>'+esc(w)+'</b></div>').join(''):'<div class="empty">Chưa có lịch sử.</div>');bindOpen('#historyList');let c=document.querySelector('#clearHist');if(c)c.onclick=()=>{localStorage.removeItem('hist');renderHistory()}}
function bindOpen(sel){document.querySelectorAll(sel+' .sopen').forEach(x=>x.onclick=()=>{q.value=x.dataset.w;document.querySelector('[data-p=dict]').click();lookup(x.dataset.w)})}
const pc=document.querySelector('#phraseCats');pc.innerHTML='<div class="toolbar">'+PHRASES.map((x,i)=>'<button class="btn pcat" data-i="'+i+'">'+esc(x[0])+'</button>').join('')+'</div>';document.querySelectorAll('.pcat').forEach(b=>b.onclick=()=>renderPhrases(+b.dataset.i));function renderPhrases(i){document.querySelector('#phraseList').innerHTML=PHRASES[i][1].map(x=>'<div class="card"><div class="phrase-cn">'+esc(x[0])+'</div><div class="phrase-vi">'+esc(x[1])+'</div>'+(x[2]?'<div class="small">'+esc(x[2])+'</div>':'')+'</div>').join('')}renderPhrases(0);
document.querySelector('#radList').innerHTML=RAD.map(x=>'<div class="rad"><div class="cat">'+esc(x[1])+'</div><div class="small">'+esc(String(x[2]).replace(/<[^>]*>/g,' ').slice(0,160))+'</div></div>').join('');

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script></body></html>
